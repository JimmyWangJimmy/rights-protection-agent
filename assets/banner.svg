<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; font-size: 52px; fill: #FFFFFF; letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 500; font-size: 21px; fill: #94A3B8; letter-spacing: 1px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 600; font-size: 14px; fill: #E2E8F0; }
    .tag-text { font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 13px; fill: #38BDF8; font-weight: 600; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    
    <line x1="150" y1="0" x2="150" y2="460" />
    <line x1="350" y1="0" x2="350" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
    <line x1="850" y1="0" x2="850" y2="460" />
    <line x1="1050" y1="0" x2="1050" y2="460" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="220" cy="180" r="180" fill="#3B82F6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="980" cy="240" r="200" fill="#8B5CF6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="600" cy="100" r="120" fill="#06B6D4" opacity="0.12" filter="url(#softGlow)" />

  <!-- Left Icon Emblem: Scales of Justice + Shield -->
  <g transform="translate(100, 110)">
    <!-- Outer Shield Container -->
    <path d="M 90 20 L 170 55 C 170 145 90 205 90 205 C 90 205 10 145 10 55 Z" 
          fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Scales of Justice Vector Art -->
    <g transform="translate(50, 48)" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Central Pillar & Beam -->
      <line x1="40" y1="20" x2="40" y2="95" stroke="#38BDF8" stroke-width="3.5" />
      <line x1="25" y1="95" x2="55" y2="95" stroke="#38BDF8" stroke-width="3" />
      <line x1="12" y1="36" x2="68" y2="36" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="40" cy="20" r="4.5" fill="#38BDF8" />
      
      <!-- Left Pan -->
      <line x1="12" y1="36" x2="4" y2="62" opacity="0.8" />
      <line x1="12" y1="36" x2="20" y2="62" opacity="0.8" />
      <path d="M 0 62 Q 12 72 24 62 Z" fill="#38BDF8" fill-opacity="0.4" stroke="#38BDF8" />

      <!-- Right Pan (Slightly elevated, symbol of triumph) -->
      <line x1="68" y1="36" x2="60" y2="58" opacity="0.8" />
      <line x1="68" y1="36" x2="76" y2="58" opacity="0.8" />
      <path d="M 56 58 Q 68 68 80 58 Z" fill="#818CF8" fill-opacity="0.4" stroke="#818CF8" />
    </g>
  </g>

  <!-- Main Headline & Narrative -->
  <g transform="translate(340, 130)">
    <!-- Tech Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4" fill="#38BDF8" />
      <text x="26" y="19" class="tag-text">OPEN SOURCE AGENT SKILL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title">
      维权代理人 <tspan fill="url(#accentGrad)">Rights Protection Agent</tspan>
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="118" class="subtitle">
      面向普通民众的数字维权参谋长 · 非对称博弈决策大脑与公文代写引擎
    </text>
  </g>

  <!-- 4 Feature Cards at the Bottom -->
  <g transform="translate(100, 310)">
    <!-- Card 1: 真实法条零幻觉 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="230" height="96" rx="12" fill="#38BDF8" fill-opacity="0.03" />
      <circle cx="32" cy="34" r="16" fill="#0284C7" fill-opacity="0.2" />
      <text x="26" y="40" font-size="16">🏛️</text>
      <text x="58" y="38" class="badge-text">真实法条零幻觉</text>
      <text x="20" y="72" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">绑定人大法工委国家法库<br/>严核条款适用性门槛</text>
    </g>

    <!-- Card 2: 逆风取证指南 -->
    <g transform="translate(254, 0)">
      <rect width="230" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="230" height="96" rx="12" fill="#818CF8" fill-opacity="0.03" />
      <circle cx="32" cy="34" r="16" fill="#6366F1" fill-opacity="0.2" />
      <text x="26" y="40" font-size="16">🛡️</text>
      <text x="58" y="38" class="badge-text">逆风证据链抢救</text>
      <text x="20" y="72" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">iPhone外放双机录音合法<br/>微信带章免检诉讼凭证</text>
    </g>

    <!-- Card 3: 多LLM红蓝对抗 -->
    <g transform="translate(508, 0)">
      <rect width="230" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="230" height="96" rx="12" fill="#EC4899" fill-opacity="0.03" />
      <circle cx="32" cy="34" r="16" fill="#DB2777" fill-opacity="0.2" />
      <text x="26" y="40" font-size="16">🎭</text>
      <text x="58" y="38" class="badge-text">多LLM红蓝对抗推演</text>
      <text x="20" y="72" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">模拟刺头法务刁难抗辩<br/>测算中立审判法官心证</text>
    </g>

    <!-- Card 4: 渐进式披露 -->
    <g transform="translate(762, 0)">
      <rect width="238" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="238" height="96" rx="12" fill="#10B981" fill-opacity="0.03" />
      <circle cx="32" cy="34" r="16" fill="#059669" fill-opacity="0.2" />
      <text x="26" y="40" font-size="16">🧭</text>
      <text x="58" y="38" class="badge-text">渐进式披露状态机</text>
      <text x="20" y="72" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">拒绝信息轰炸与上下文溢出<br/>一次只下一招，按需代写</text>
    </g>
  </g>
</svg>
